<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#09090b" />
    <title>Romp</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" />
    <link rel="stylesheet" href="/src/ui.css" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var script = document.createElement('script');
        var supportsModules = 'noModule' in script;
        var supportsCamera = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
        if (!supportsModules || !supportsCamera) {
          var root = document.getElementById('root');
          root.innerHTML =
            '<main style="box-sizing:border-box;min-height:100vh;padding:32px 22px;background:#09090b;color:#f4f4f5;font:16px/1.6 -apple-system,BlinkMacSystemFont,Arial,sans-serif;display:flex;flex-direction:column;justify-content:center;max-width:680px;margin:auto">' +
            '<h1 style="font-size:32px;margin:0 0 16px">Romp needs a newer browser</h1>' +
            '<p>This iPad browser is too old to run Romp’s motion-tracking games.</p>' +
            '<p>Romp needs JavaScript modules and browser camera access. Safari on iOS 9.3.6 does not support these required features.</p>' +
            '<p>To play, use a newer device with a supported, up-to-date browser. This compatibility test has not changed the production version.</p>' +
            '</main>';
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
